<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo -->
  <rect width="100" height="100" rx="20" fill="#0b1a2e"/>
  
  <!-- Letra B estilizada -->
  <text x="50" y="70" font-family="'Outfit', sans-serif, Arial" font-size="65" font-weight="700" fill="#f0b429" text-anchor="middle" letter-spacing="-2">B</text>
  
  <!-- Punto decorativo (punto de la B) -->
  <circle cx="50" cy="85" r="4" fill="#f0b429" opacity="0.6"/>
  
  <!-- Línea inferior sutil -->
  <line x1="20" y1="88" x2="80" y2="88" stroke="#f0b429" stroke-width="2" opacity="0.3"/>
</svg>